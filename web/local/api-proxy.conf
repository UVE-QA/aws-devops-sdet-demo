# MOUNTED BY docker-compose.yml ONLY (ADR-0095). Locally there is no load
# balancer, so the web container stands in for the ALB's path rules and sends
# the api's routes to the api container. The AWS image never carries this file.
# RESOLVED PER REQUEST, NOT AT STARTUP. nginx resolves a hostname written
# into proxy_pass once, when it starts, and keeps the address; recreate the
# api container and every request is a 502 until nginx restarts. Found on
# 2026-09-13 when 54 contract tests failed at once after `up --force-recreate
# app`. A variable in proxy_pass and Docker's own resolver make it look the
# name up again.
resolver 127.0.0.11 valid=10s;
set $api http://app:8000;

location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /health {
    proxy_pass $api;
}
