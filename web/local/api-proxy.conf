# MOUNTED BY docker-compose.yml ONLY (ADR-0095). Locally there is no load
# balancer, so the web container stands in for the ALB's path rules and sends
# the api's routes to the api container. The AWS image never carries this file.
location /api/ {
    proxy_pass http://app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /health {
    proxy_pass http://app:8000;
}
