# The web service's one server block (ADR-0095).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The health check the target group and the container ask. Not `/`: the
    # page is the thing being served, and a health check that fetched it would
    # be a request in the access log for every probe.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # LOCAL ONLY. Compose mounts web/local/api-proxy.conf here so that one
    # origin serves both the page and /api on the devbox, where there is no
    # load balancer to route by path. In AWS the directory is empty and the
    # include matches nothing: the ALB's listener rules send /api/* to the api
    # service and this server never sees it.
    include /etc/nginx/conf.d/local/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
