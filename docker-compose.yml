# Local development stack for v0 (Lightsail devbox).
# postgres is NOT published to the host — it stays on the internal network.
# Only the app port 8000 is exposed locally (reach it via SSH tunnel).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    # No "ports:" on purpose — 5432 must not be reachable from outside.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Named explicitly, and not left to Compose. Without this line the built
    # image is <project>-app, where <project> is the DIRECTORY NAME - so the
    # same commit produces a different image name depending on where it was
    # checked out, and anything that needs to find that image has to ask
    # Compose what it decided. `docker compose config --images app` answers
    # that question differently on different Compose versions: on the devbox it
    # filters by service, on a GitHub runner it returned every service, and the
    # image scan was handed postgres:16. It refused, because postgres was not
    # built in that job - but in a job where it IS pulled, the scan would have
    # reported cleanly on the wrong image.
    image: aws-devops-sdet-demo-app:local
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      # Matches the docker-compose service name "postgres" as host.
      DATABASE_URL: postgresql+psycopg2://demo:demo@postgres:5432/demo
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
