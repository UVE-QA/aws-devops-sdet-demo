# Local development stack for v0 (Lightsail devbox).
# postgres is NOT published to the host — it stays on the internal network.
# Only port 8000 is exposed locally (reach it via SSH tunnel), and since
# ADR-0095 it is the web container's: the page from nginx, /api proxied to app.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    # No "ports:" on purpose — 5432 must not be reachable from outside.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Named explicitly, and not left to Compose. Without this line the built
    # image is <project>-app, where <project> is the DIRECTORY NAME - so the
    # same commit produces a different image name depending on where it was
    # checked out, and anything that needs to find that image has to ask
    # Compose what it decided. `docker compose config --images app` answers
    # that question differently on different Compose versions: on the devbox it
    # filters by service, on a GitHub runner it returned every service, and the
    # image scan was handed postgres:16. It refused, because postgres was not
    # built in that job - but in a job where it IS pulled, the scan would have
    # reported cleanly on the wrong image.
    image: aws-devops-sdet-demo-app:local
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      # Matches the docker-compose service name "postgres" as host.
      DATABASE_URL: postgresql+psycopg2://demo:demo@postgres:5432/demo
      # Tags every log line with where it was produced (ADR-0032). The AWS
      # environments pass "stage"/"prod" through the task definition, so a line
      # can never be mistaken for one from another environment.
      APP_ENV: local
      # The queue (ADR-0096). Locally it is ElasticMQ; the three lines below
      # are the whole difference from AWS, where the endpoint is unset and the
      # credentials are the task role's.
      ITEMS_QUEUE_URL: http://elasticmq:9324/000000000000/items
      SQS_ENDPOINT_URL: http://elasticmq:9324
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-west-2
    # NOT published any more (ADR-0095): the web service is the one origin on
    # 8000, and it proxies /api to this container - see web/local/api-proxy.conf.
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started

  elasticmq:
    # SQS on the devbox (ADR-0096): the same two queues and the same redrive
    # as the module declares, from worker/local/elasticmq.conf. Not published
    # to the host; the api and the worker reach it by name.
    image: softwaremill/elasticmq-native:1.6.12
    volumes:
      - ./worker/local/elasticmq.conf:/opt/elasticmq.conf:ro

  worker:
    # The consumer (ADR-0096). Named for the same reason the other two are:
    # the image scan looks for it by this name.
    image: aws-devops-sdet-demo-worker:local
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://demo:demo@postgres:5432/demo
      APP_ENV: local
      ITEMS_QUEUE_URL: http://elasticmq:9324/000000000000/items
      SQS_ENDPOINT_URL: http://elasticmq:9324
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-west-2
    healthcheck:
      # The heartbeat the loop touches on every pass (consumer/main.py).
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started

  web:
    # The interface, in a container of its own (ADR-0095). Named for the same
    # reason `app` is: the image scan looks for it by this name.
    image: aws-devops-sdet-demo-web:local
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    volumes:
      # The stand-in for the load balancer's path rules, locally only. The AWS
      # image never carries this file; the ALB does what it does here.
      - ./web/local:/etc/nginx/conf.d/local:ro
    depends_on:
      - app

volumes:
  pgdata:
