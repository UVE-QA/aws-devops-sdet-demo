# THE LOCAL QUEUE (ADR-0096): ElasticMQ standing in for SQS on the devbox, the
# same two queues and the same redrive the module declares in AWS, so the
# worker's code has no local branch at all - it is pointed at a different
# endpoint and nothing else.
#
# The visibility timeout is 5 s here and 30 s in AWS, on purpose: the poison
# break test waits for three failed receipts to carry a message to the
# dead-letter queue, and thirty seconds times three is a test nobody runs.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  items {
    defaultVisibilityTimeout = 5 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "items-dlq"
      maxReceiveCount = 3
    }
  }
  items-dlq {}
  # The results queue (ADR-0098): the worker's reports back to the api,
  # with the same redrive.
  results {
    defaultVisibilityTimeout = 5 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "results-dlq"
      maxReceiveCount = 3
    }
  }
  results-dlq {}
}
