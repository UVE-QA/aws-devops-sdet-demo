name: deploy-stage

# Deploys the stage environment to the demo AWS account via GitHub OIDC.
# No static AWS keys. AWS identifiers (region, account id, role ARN, owner) come
# from environment Variables (vars.*); the budget email is a Secret, because a
# variable is not masked in the logs of a public repository.
# Image flow: build+push by commit SHA, then `terraform apply` with
# TF_VAR_app_image=<ECR_URL>:<SHA> so the service runs exactly that revision
# (no separate update-service). One-off migrate/seed/db-assert reuse the SAME
# task definition via run-task containerOverrides (ADR-0007). The first stage
# apply was done LOCALLY (OIDC role bootstrap); this workflow runs the rest.

# Manual only. A push to main must not spin up billable infrastructure
# (ALB + RDS + ECS) in the demo account; the stage environment is short-lived
# and is brought up on demand, then torn down via destroy.yml.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stage
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_demo_account_id: ${{ vars.TF_VAR_demo_account_id }}
      # Where scripts/tf-stream.sh drops every terraform event stream, and where
      # scripts/fold-timeline.py looks for them (ADR-0039 D2). Job level, because
      # the capture and the fold are different steps and a path repeated in two
      # of them is a path that can disagree with itself.
      TF_STREAM_DIR: /tmp/tf-streams
      # A SECRET, not a variable (Phase 15). GitHub does not mask variables, so
      # this address was printed in the step env dump of a PUBLIC repository's
      # logs. It is scoped to the `stage` and `prod` environments, exactly as the
      # variable it replaces was.
      TF_VAR_budget_email: ${{ secrets.TF_VAR_BUDGET_EMAIL }}
      TF_VAR_owner: ${{ vars.TF_VAR_owner }}
      # One value, read by the Playwright regression that WRITES it through the
      # browser and by the ECS task that then LOOKS IT UP in RDS. Defined at job
      # level precisely so the two steps cannot drift apart.
      UI_PROBE_NAME: ui-probe-${{ github.run_id }}-${{ github.run_attempt }}
      # The edit probe, same contract: written by the browser, read by the ECS
      # task. It is created under a different name and renamed through the UI,
      # so the assertion can require that the row was UPDATED and not merely
      # inserted (Phase 16a).
      UI_EDIT_PROBE_NAME: ui-edit-probe-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.5"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Terraform init (S3 backend)
        working-directory: infra/envs/stage
        run: terraform init -input=false

      - name: Resolve shared ECR repository URL
        id: repo
        shell: bash
        env:
          ECR_REPOSITORY: aws-devops-sdet-demo-app
        run: |
          set -euo pipefail
          # `|| true` so a missing repository reaches the check below and gets
          # the actionable message, instead of dying on the raw AWS exception.
          url="$(aws ecr describe-repositories \
                   --region "$AWS_REGION" \
                   --repository-names "$ECR_REPOSITORY" \
                   --query 'repositories[0].repositoryUri' --output text 2>/dev/null || true)"
          if [ -z "$url" ] || [ "$url" = "None" ]; then
            echo "::error::shared ECR repository $ECR_REPOSITORY not found — apply infra/shared-ecr first (ADR-0018)"
            exit 1
          fi
          echo "ecr_url=$url" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push image
        env:
          ECR_URL: ${{ steps.repo.outputs.ecr_url }}
          ECR_REPOSITORY: aws-devops-sdet-demo-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The `:latest` tag is gone (ADR-0029). Nothing ever read it — no
          # workflow, module, script or make target — and a mutable tag inside
          # an immutable registry is a pointer that can start lying.
          #
          # Because the registry is now IMMUTABLE, re-pushing an existing tag is
          # an ERROR rather than a no-op, and re-running this workflow on the
          # same commit is an ordinary thing to do after a flaky failure. When
          # the tag is already present the bytes for this commit already exist,
          # so reuse them: rebuilding would produce a different artifact under
          # the same name, which is the exact confusion immutability exists to
          # prevent.
          if aws ecr describe-images --region "$AWS_REGION" \
               --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "$IMAGE_TAG is already in $ECR_REPOSITORY - reusing it, not rebuilding"
            exit 0
          fi

          docker build -t "$ECR_URL:$IMAGE_TAG" ./app
          docker push "$ECR_URL:$IMAGE_TAG"

      - name: Terraform plan
        working-directory: infra/envs/stage
        env:
          TF_VAR_app_image: ${{ steps.repo.outputs.ecr_url }}:${{ github.sha }}
        run: terraform plan -input=false -out=tfplan

      # `-json` replaces terraform's human-readable output with an event stream,
      # which is what the timeline is folded from (ADR-0039 D2). The legible
      # summary comes back in the fold step below - that is not optional, and
      # losing the readable log to gain a picture would be a bad trade.
      - name: Terraform apply
        working-directory: infra/envs/stage
        run: >
          $GITHUB_WORKSPACE/scripts/tf-stream.sh apply
          apply -input=false -auto-approve -json tfplan

      - name: Read stage outputs
        id: tf
        working-directory: infra/envs/stage
        run: |
          {
            echo "cluster=$(terraform output -raw ecs_cluster_name)"
            echo "service=$(terraform output -raw ecs_service_name)"
            echo "task_def=$(terraform output -raw task_definition_arn)"
            echo "container=$(terraform output -raw container_name)"
            echo "sg=$(terraform output -raw ecs_app_security_group_id)"
            echo "alb_url=$(terraform output -raw alb_url)"
            echo "subnets=$(terraform output -json public_subnet_ids | jq -r 'join(",")')"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for ECS service to be stable
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.tf.outputs.cluster }}" \
            --services "${{ steps.tf.outputs.service }}"

      - name: Run one-off tasks (migrate, seed, db-assert)
        env:
          CLUSTER: ${{ steps.tf.outputs.cluster }}
          TASK_DEF: ${{ steps.tf.outputs.task_def }}
          CONTAINER: ${{ steps.tf.outputs.container }}
          SUBNETS: ${{ steps.tf.outputs.subnets }}
          SG: ${{ steps.tf.outputs.sg }}
        run: |
          scripts/ecs-run-task.sh migrate   '["alembic","upgrade","head"]'
          scripts/ecs-run-task.sh seed      '["python","scripts/seed.py"]'
          scripts/ecs-run-task.sh db-assert '["python","scripts/assert_seed.py"]'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Every spec belongs to a project
        run: make test-spec-coverage

      - name: API contract tests against the ALB
        env:
          BASE_URL: ${{ steps.tf.outputs.alb_url }}
        run: make test-api BASE_URL="$BASE_URL"

      - name: Playwright smoke + regression against the ALB
        working-directory: tests/playwright
        env:
          BASE_URL: ${{ steps.tf.outputs.alb_url }}
        run: |
          # Both projects are named EXPLICITLY rather than relying on "run
          # everything". stage is the environment where the destructive suite
          # belongs, but a bare `playwright test` would also silently adopt any
          # future project, which is how prod nearly inherited this suite.
          #
          # One invocation, so the uploaded HTML report contains both suites:
          # two runs would leave only the second in playwright-report/.
          npm install
          npx playwright install --with-deps chromium
          npx playwright test --project=smoke --project=regression

      - name: Assert the UI write reached RDS
        env:
          CLUSTER: ${{ steps.tf.outputs.cluster }}
          TASK_DEF: ${{ steps.tf.outputs.task_def }}
          CONTAINER: ${{ steps.tf.outputs.container }}
          SUBNETS: ${{ steps.tf.outputs.subnets }}
          SG: ${{ steps.tf.outputs.sg }}
        run: |
          # The regression created UI_PROBE_NAME and renamed a row to
          # UI_EDIT_PROBE_NAME through the browser, and left both there. This
          # reads the database directly, from a different process, over a
          # different protocol. RDS is in private subnets, so the only way in
          # is a task inside the VPC.
          scripts/ecs-run-task.sh ui-write-assert \
            '["python","scripts/assert_ui_write.py"]' \
            "$(jq -nc --arg v "$UI_PROBE_NAME" --arg e "$UI_EDIT_PROBE_NAME" \
               '[{name:"UI_PROBE_NAME",value:$v},{name:"UI_EDIT_PROBE_NAME",value:$e}]')"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # ---------------------------------------------------------------------
      # Dashboard (ADR-0026). Two steps and TWO ROLES, deliberately: the
      # observation needs the deploy role's read access to ECS/ALB/RDS, the
      # upload needs only the narrow publish role. Re-configuring credentials
      # here also means every step after this point has lost the deploy role,
      # which is why these are last.
      #
      # `if: always()` throughout. A run that died half way is exactly when the
      # dashboard must be written, because that is when the environment is in a
      # state nobody would have predicted - and a status file that only ever
      # appears after success would report the account as whatever it was the
      # last time things went well.
      # ---------------------------------------------------------------------
      - name: Observe what stage has in AWS
        if: always()
        env:
          APP_URL: ${{ steps.tf.outputs.alb_url }}
        run: scripts/observe-environment.sh stage > /tmp/observation.json

      # The readable apply log, and the timeline the map draws. Uses no
      # credential of any kind: it reads only the streams tf-stream.sh captured.
      # `if: always()`, because the run that died half way is the one whose
      # timeline matters - and a stream with no exit code beside it folds into
      # INCOMPLETE rather than into a plausible complete cycle.
      - name: Fold the terraform event stream into a timeline
        if: always()
        run: >
          python3 scripts/fold-timeline.py
          --environment stage
          --stream-dir "$TF_STREAM_DIR"
          --out /tmp/timeline-stage.json

      # The join onto the map's nodes (ADR-0039 D4). Separate from the fold
      # because it answers a different question - the fold says what terraform
      # did, this says which node on the picture that was - and separate from
      # the page because the rule would otherwise live in JavaScript here and in
      # Python in the gate that checks it.
      #
      # `if: always()` for the same reason the fold has it, and no `continue-on-
      # error`: the script exits 0 even when addresses go unmatched, on purpose.
      - name: Join the timeline onto the map's nodes
        if: always()
        run: >
          python3 scripts/node-states.py
          --topology site/data/topology.json
          --timeline /tmp/timeline-stage.json
          --out /tmp/nodes-stage.json

      - name: Configure AWS credentials (OIDC, publish role)
        if: always()
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.SITE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish status and report to the dashboard
        if: always()
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          SITE_DISTRIBUTION_ID: ${{ vars.SITE_DISTRIBUTION_ID }}
          SITE_BASE_URL: ${{ vars.SITE_URL }}
          JOB_STATUS: ${{ job.status }}
          TIMELINE_JSON: /tmp/timeline-stage.json
          NODE_STATES_JSON: /tmp/nodes-stage.json
        run: scripts/publish-status.sh stage /tmp/observation.json tests/playwright/playwright-report
