name: publish-runs

# THE MOMENT NO JOB OF A RUN CAN SEE (ADR-0100). A run is not `completed` until
# its last job has ended, so the last snapshot a job publishes always shows the
# run still going. GitHub starts this one when a lifecycle workflow completes,
# and it writes the snapshot that says so - the runs list with the final
# conclusion, and the jobs of the run that just ended.
#
# It triggers on the DEFAULT branch's copy of this file, for runs of the listed
# workflows from any branch - which is what the page wants: a `next` cycle
# ending is news about the environments too (ADR-0093 D2, amended).
#
# Not a lifecycle workflow itself: it writes nothing but status/runs.json, and
# the page's WRITERS table does not name it, so it makes no environment stale.

on:
  workflow_run:
    workflows: [self-service, deploy-stage, promote-prod, destroy]
    types: [completed]
  # By hand, for a run the hook did not see: #33 completed while this file
  # lived on `next` only, and a workflow_run trigger fires from the default
  # branch's copy - so its last snapshot said `in_progress` until someone
  # wrote another. The page stops believing such a snapshot after three
  # hours (ADR-0100 D3); this is the way to write the true one sooner.
  workflow_dispatch:
    inputs:
      run_id:
        description: "the completed run whose jobs and conclusion to publish (empty: the list alone)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  # One writer at a time; the newest reading wins, older ones are dropped.
  group: publish-runs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC, publish role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.SITE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish the run history with the completed run's conclusion
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          if [ -n "$RUN_ID" ]; then
            scripts/publish-runs.sh completed --run-id "$RUN_ID"
          else
            scripts/publish-runs.sh completed
          fi
          echo "completed: ${{ github.event.workflow_run.name || 'by hand' }} #${{ github.event.workflow_run.run_number || inputs.run_id }} (${{ github.event.workflow_run.conclusion || 'as the API says' }})"
