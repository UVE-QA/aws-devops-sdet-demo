name: ci

# Deterministic, AWS-free CI: brings up the local Docker Compose stack and
# runs the exact same make targets used on the devbox, then Terraform fmt/validate,
# then the secret scan.
# No AWS credentials are used or required anywhere in this workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install app dependencies (backend checks)
        run: pip install -r app/requirements.txt

      - name: Backend import check
        working-directory: app
        run: python -c "import src.main; print('app imports OK')"

      # Before the stack is up, deliberately: this suite needs no database and
      # no container, and it is the only place the shape of the log line the
      # 5xx alarm reads can be asserted at all (ADR-0032).
      - name: In-process tests (log shape, request id)
        run: make test-unit

      - name: Build app image
        run: make docker-build

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Bring up local stack (postgres + app)
        run: make local-up

      - name: Wait for app /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "app healthy"; exit 0
            fi
            echo "waiting for app ($i)..."; sleep 2
          done
          echo "app did not become healthy in time"; exit 1

      - name: Migrate
        run: make migrate

      - name: Seed
        run: make seed

      - name: Every spec belongs to a project
        # Before the smoke/regression split this check did not exist, and a
        # spec in the wrong directory would have run in no suite while CI
        # stayed green.
        run: make test-spec-coverage

      - name: API contract tests
        run: make test-api

      - name: Playwright smoke (read-only)
        run: make test-smoke

      - name: Playwright regression + UI write assertion (destructive)
        run: make test-regression

      - name: Seed DB assertion
        run: make test-db

      - name: The map's inventory still matches the suites
        # Last in this job on purpose: collecting needs the unit venv, the api
        # venv and playwright's node_modules, and each one is a side effect of a
        # step above. It cannot join the map's own gate in `terraform-checks`,
        # which installs none of them (ADR-0042 D2).
        run: make suite-inventory-check

      - name: Tear down local stack
        if: always()
        run: make local-down

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.5"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra

      - name: Terraform validate (every root level, no backend)
        run: make tf-validate

      - name: The living documents describe things that exist
        # README, architecture and demo-script are the documents a reader is
        # expected to ACT on. Every make target, repo path, route and workflow
        # they name is checked against the repository, and the check refuses to
        # pass if the list of documents itself has gone missing.
        run: make docs-check

      - name: The map's data still matches infra/
        # The other half of the same problem, and the half a reference check
        # cannot reach: docs-check verifies that everything a document NAMES
        # exists, never that what it CLAIMS is true, and six of the eleven stale
        # places found on 2026-08-08 were COUNTS - numbers that go stale without
        # a word changing around them. This regenerates the map's data from
        # infra/ and tests/ and fails if the committed file disagrees, or if a
        # resource block has been added that belongs to no display group.
        run: make site-data-check

      - name: The published page is what its template builds
        # site/index.html is a build output that is COMMITTED, so that the
        # published page stays one self-contained file. A committed output
        # invites being edited in place, and that edit survives only until the
        # next build silently reverts it. Byte-identical or red.
        run: make site-page-check

      - name: A killed apply folds into an INCOMPLETE timeline
        # The gate over the fold that turns Terraform's -json stream into the
        # timeline the page will draw (ADR-0039 D2). Its fixtures are real
        # terraform output, one of them from a process killed mid-apply - a
        # stream that ends in the middle of a resource with no exit code beside
        # it, which is exactly what a cancelled workflow step leaves behind. A
        # timeline that read that as complete would be the most confident lie
        # this dashboard could tell. No AWS and no cost: every resource in the
        # fixtures is the built-in terraform_data.
        run: make timeline-check

      - name: Every resource a cycle touches lands on a node, or is named
        # The gate over the join from that timeline onto the map (ADR-0039 D4).
        # Coverage, in the same shape as the spec-coverage guard and as
        # site-data-check one level up: site-data-check asks whether every
        # resource in the REPOSITORY has been decided about, this asks the same
        # of every resource a cycle actually touched. A resource created in AWS
        # and drawn nowhere is reported as UNKNOWN rather than being missing from
        # a picture that looks complete.
        run: make node-states-check

      - name: A run's report decides what a suite node says
        # The fold from pytest's junit, Playwright's JSON reporter and the db
        # assertion's stdout onto the map's suite nodes. Fixtures only: it reads
        # files, calls nothing, and costs nothing (ADR-0042 D5).
        run: make results-check

      - name: A node with no step of its own never claims to be running
        # The gate over the one piece of map logic that cannot move off the page
        # (ADR-0043 D3): it reads the Actions API live in the browser, so there
        # is no run afterwards to fold. Instead of a second copy in Python, the
        # gate lifts the marked block out of the BUILT page and runs that. Node
        # is preinstalled on this image and the block is plain ES2015, so there
        # is no setup step and no version this check is sensitive to.
        run: make live-state-check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Checkov (pinned version)
        # A literal, for the same reason the gitleaks version is one: a scanner
        # that Dependabot can bump silently changes what the gate means without
        # anyone deciding to. It moves when someone edits this line.
        #
        # Weaker than the gitleaks step, and worth saying so: this is a pinned
        # version over TLS, not a checksum. Hash-pinning a pip install means
        # hash-pinning its whole dependency tree, which is a requirements file
        # nobody would maintain for one tool.
        env:
          CHECKOV_VERSION: "3.3.8"
        run: pip install --quiet "checkov==${CHECKOV_VERSION}"

      - name: Every action is pinned to a commit SHA
        # Lives in this job because it is the repository-wide static check job,
        # despite the name - `make docs-check` is here for the same reason.
        run: make action-pins

      - name: IaC scan (Checkov)
        # The decisions are in .checkov.yaml, next to the checks they skip.
        # The target refuses if that file, the scanner, or the Terraform it is
        # meant to be scanning has gone missing.
        run: make iac-scan

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkov-report
          path: checkov-report.json
          if-no-files-found: ignore
          retention-days: 7

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy (pinned version, checksum verified)
        # Same reasoning as the gitleaks step: a scanner installed by version
        # and verified by checksum is the practice this phase demonstrates, and
        # a literal version is one Dependabot cannot bump silently. The
        # checksum came from the release's own checksums file, verified on the
        # devbox before it was written here.
        env:
          TRIVY_VERSION: "0.72.0"
          TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

      - name: Build the app image
        # Built here rather than reused from local-ci: a separate job gives the
        # supply-chain result its own readable check, and the build is under a
        # minute. The image scanned is therefore the one this commit produces.
        run: make docker-build

      - name: Scan the image
        run: make image-scan

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, every ref)
        # fetch-depth: 0 is the whole point. The default is a depth-1 checkout,
        # and scanning one commit reports no leaks on a history full of them -
        # an empty result that is indistinguishable from a clean one. The
        # `make secret-scan` target refuses on a shallow clone for that reason,
        # so if this line is ever removed the job fails rather than passes.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned version, checksum verified)
        # Deliberately NOT gitleaks/gitleaks-action: it requires a
        # GITLEAKS_LICENSE for organization-owned repositories, and this is the
        # supply-chain phase - a scanner installed by version and verified by
        # checksum is the practice the phase is meant to demonstrate. The
        # version is a literal here so Dependabot cannot bump it silently; it
        # moves when someone changes it and updates the checksum beside it.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Secret scan, full history, every ref
        # The same target the devbox runs. It prints the commit count it is
        # about to cover, so the log says what was scanned rather than only
        # that something was.
        run: make secret-scan

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7
