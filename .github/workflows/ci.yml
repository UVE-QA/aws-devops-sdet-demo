name: ci

# Deterministic, AWS-free CI: brings up the local Docker Compose stack and
# runs the exact same make targets used on the devbox, then Terraform fmt/validate,
# then the secret scan.
# No AWS credentials are used or required anywhere in this workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install app dependencies (backend checks)
        run: pip install -r app/requirements.txt

      - name: Backend import check
        working-directory: app
        run: python -c "import src.main; print('app imports OK')"

      - name: Build app image
        run: make docker-build

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Bring up local stack (postgres + app)
        run: make local-up

      - name: Wait for app /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "app healthy"; exit 0
            fi
            echo "waiting for app ($i)..."; sleep 2
          done
          echo "app did not become healthy in time"; exit 1

      - name: Migrate
        run: make migrate

      - name: Seed
        run: make seed

      - name: Every spec belongs to a project
        # Before the smoke/regression split this check did not exist, and a
        # spec in the wrong directory would have run in no suite while CI
        # stayed green.
        run: make test-spec-coverage

      - name: API contract tests
        run: make test-api

      - name: Playwright smoke (read-only)
        run: make test-smoke

      - name: Playwright regression + UI write assertion (destructive)
        run: make test-regression

      - name: Seed DB assertion
        run: make test-db

      - name: Tear down local stack
        if: always()
        run: make local-down

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra

      - name: Terraform validate (every root level, no backend)
        run: make tf-validate

      - name: The living documents describe things that exist
        # README, architecture and demo-script are the documents a reader is
        # expected to ACT on. Every make target, repo path, route and workflow
        # they name is checked against the repository, and the check refuses to
        # pass if the list of documents itself has gone missing.
        run: make docs-check

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Checkov (pinned version)
        # A literal, for the same reason the gitleaks version is one: a scanner
        # that Dependabot can bump silently changes what the gate means without
        # anyone deciding to. It moves when someone edits this line.
        #
        # Weaker than the gitleaks step, and worth saying so: this is a pinned
        # version over TLS, not a checksum. Hash-pinning a pip install means
        # hash-pinning its whole dependency tree, which is a requirements file
        # nobody would maintain for one tool.
        env:
          CHECKOV_VERSION: "3.3.8"
        run: pip install --quiet "checkov==${CHECKOV_VERSION}"

      - name: IaC scan (Checkov)
        # The decisions are in .checkov.yaml, next to the checks they skip.
        # The target refuses if that file, the scanner, or the Terraform it is
        # meant to be scanning has gone missing.
        run: make iac-scan

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-report
          path: checkov-report.json
          if-no-files-found: ignore
          retention-days: 7

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Trivy (pinned version, checksum verified)
        # Same reasoning as the gitleaks step: a scanner installed by version
        # and verified by checksum is the practice this phase demonstrates, and
        # a literal version is one Dependabot cannot bump silently. The
        # checksum came from the release's own checksums file, verified on the
        # devbox before it was written here.
        env:
          TRIVY_VERSION: "0.72.0"
          TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

      - name: Build the app image
        # Built here rather than reused from local-ci: a separate job gives the
        # supply-chain result its own readable check, and the build is under a
        # minute. The image scanned is therefore the one this commit produces.
        run: make docker-build

      - name: Scan the image
        run: make image-scan

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, every ref)
        # fetch-depth: 0 is the whole point. The default is a depth-1 checkout,
        # and scanning one commit reports no leaks on a history full of them -
        # an empty result that is indistinguishable from a clean one. The
        # `make secret-scan` target refuses on a shallow clone for that reason,
        # so if this line is ever removed the job fails rather than passes.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned version, checksum verified)
        # Deliberately NOT gitleaks/gitleaks-action: it requires a
        # GITLEAKS_LICENSE for organization-owned repositories, and this is the
        # supply-chain phase - a scanner installed by version and verified by
        # checksum is the practice the phase is meant to demonstrate. The
        # version is a literal here so Dependabot cannot bump it silently; it
        # moves when someone changes it and updates the checksum beside it.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Secret scan, full history, every ref
        # The same target the devbox runs. It prints the commit count it is
        # about to cover, so the log says what was scanned rather than only
        # that something was.
        run: make secret-scan

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7
