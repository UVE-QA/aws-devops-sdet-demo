name: destroy

# Tears down a Terraform environment in the demo AWS account via GitHub OIDC.
# Manual only. Requires confirm == DESTROY. Ends with a verification step that
# lists any remaining billable resources and fails if something is still present.
# The Terraform state bucket (infra/bootstrap) is intentionally NOT touched.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - stage
          - prod
        # Both choices are real as of Phase 9.1: infra/bootstrap-oidc creates one
        # deploy role PER ENVIRONMENT (ADR-0021) and the role ARN below is
        # derived from the environment name. Destroying prod additionally pauses
        # for required reviewers, because the job declares
        # `environment: ${{ inputs.environment }}`.
      confirm:
        description: "Type DESTROY to confirm"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_demo_account_id: ${{ vars.TF_VAR_demo_account_id }}
      TF_VAR_budget_email: ${{ vars.TF_VAR_budget_email }}
      TF_VAR_owner: ${{ vars.TF_VAR_owner }}
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "confirm must be exactly DESTROY (got: '${{ inputs.confirm }}')"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"

      - name: Resolve deploy role ARN for ${{ inputs.environment }}
        id: role
        run: |
          ROLE="arn:aws:iam::${{ vars.TF_VAR_demo_account_id }}:role/aws-devops-sdet-demo-${{ inputs.environment }}-github-deploy"
          echo "arn=$ROLE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/envs/${{ inputs.environment }}
        run: terraform init -input=false

      - name: Destroy ALB first (release ENIs before the IGW)
        working-directory: infra/envs/${{ inputs.environment }}
        run: terraform destroy -input=false -auto-approve -target=module.alb

      - name: Terraform destroy
        working-directory: infra/envs/${{ inputs.environment }}
        run: terraform destroy -input=false -auto-approve

      - name: Verify no billable resources remain
        run: |
          REGION="${{ vars.AWS_REGION }}"
          # Scoped to the environment BEING DESTROYED, not to the project. With a
          # project-wide prefix this step reports the other environment's live
          # resources as leftovers: tearing down stage while prod is up would
          # fail a teardown that is in fact complete. Nothing exercised that path
          # while stage was the only environment.
          #
          # The account-wide assertions further down (NAT, EKS, unattached EIPs)
          # stay account-wide on purpose: those must not exist in v0 for ANY
          # environment, so narrowing them would weaken the check.
          PREFIX="aws-devops-sdet-demo-${{ inputs.environment }}"
          leftovers=0

          echo "::group::ECS clusters"
          ecs=$(aws ecs list-clusters --region "$REGION" \
            --query "clusterArns[?contains(@, '$PREFIX')]" --output text)
          echo "${ecs:-<none>}"
          [ -n "$ecs" ] && leftovers=$((leftovers+1))
          echo "::endgroup::"

          echo "::group::RDS instances"
          rds=$(aws rds describe-db-instances --region "$REGION" \
            --query "DBInstances[?starts_with(DBInstanceIdentifier, '$PREFIX')].DBInstanceIdentifier" \
            --output text)
          echo "${rds:-<none>}"
          [ -n "$rds" ] && leftovers=$((leftovers+1))
          echo "::endgroup::"

          echo "::group::Load balancers"
          alb=$(aws elbv2 describe-load-balancers --region "$REGION" \
            --query "LoadBalancers[?starts_with(LoadBalancerName, '$PREFIX')].LoadBalancerName" \
            --output text)
          echo "${alb:-<none>}"
          [ -n "$alb" ] && leftovers=$((leftovers+1))
          echo "::endgroup::"

          echo "::group::NAT gateways (must be none in v0)"
          nat=$(aws ec2 describe-nat-gateways --region "$REGION" \
            --filter "Name=state,Values=available,pending" \
            --query "NatGateways[].NatGatewayId" --output text)
          echo "${nat:-<none>}"
          [ -n "$nat" ] && leftovers=$((leftovers+1))
          echo "::endgroup::"

          echo "::group::EKS clusters (must be none in v0)"
          eks=$(aws eks list-clusters --region "$REGION" --query "clusters" --output text)
          echo "${eks:-<none>}"
          [ -n "$eks" ] && leftovers=$((leftovers+1))
          echo "::endgroup::"

          echo "::group::Unattached Elastic IPs"
          eip=$(aws ec2 describe-addresses --region "$REGION" \
            --query "Addresses[?AssociationId==null].PublicIp" --output text)
          echo "${eip:-<none>}"
          [ -n "$eip" ] && leftovers=$((leftovers+1))
          echo "::endgroup::"

          echo "::group::Environment ECR repositories"
          # The shared registry (ADR-0018) is named aws-devops-sdet-demo-app, so
          # it cannot match an environment prefix: it is out of scope here by
          # construction rather than by an exception that has to be maintained.
          # It is permanent and EXPECTED to survive - it holds the image prod may
          # still be running.
          ecr=$(aws ecr describe-repositories --region "$REGION" \
            --query "repositories[?starts_with(repositoryName, '$PREFIX')].repositoryName" \
            --output text)
          echo "unexpected: ${ecr:-<none>}"
          [ -n "$ecr" ] && leftovers=$((leftovers+1))
          echo "::endgroup::"

          echo "-----"
          if [ "$leftovers" -ne 0 ]; then
            echo "FAIL: $leftovers resource group(s) still present — investigate above."
            exit 1
          fi
          echo "OK: no billable ${{ inputs.environment }} resources remain (permanent levels intentionally kept)."
