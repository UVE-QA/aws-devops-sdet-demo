name: self-service

# The run has to name itself. The dashboard reads this repository's runs
# ANONYMOUSLY, and the anonymous API does not expose workflow_dispatch inputs -
# so without the launch id in the run's NAME, a visitor cannot be told that the
# run they are watching is the run they started (ADR-0026, ADR-0034).
run-name: self-service launch ${{ inputs.launch_id || 'by the owner' }}

# A public launch. Dispatched by the Lambda behind the dashboard button, never
# by a push. Everything that decides WHETHER this may run has already happened
# before the dispatch: the kill switch, the nonce, the lock and the day counter
# are all evaluated in the Lambda, against a store at a permanent level
# (ADR-0035). By the time this file executes, the launch has been permitted.
#
# WHAT THIS WORKFLOW GUARANTEES ON ITS OWN
#
#   - it deploys STAGE and only stage. There is no environment input, and it
#     declares no prod environment, so no value of anything here resolves a prod
#     credential (ADR-0034)
#   - it destroys what it created, `if: always()`, including when the tests fail
#   - it finishes inside its own timeout, which is strictly LESS than the TTL,
#     so a hung run reaches its own destroy before the deadline it is held to
#   - it releases the lock in a final job that also runs `if: always()`
#
# WHAT IT CANNOT GUARANTEE, WHICH IS WHY THE WATCHDOG EXISTS
#
# `if: always()` is a promise made by the thing that might not be there. A
# force-cancelled run, a dead runner, or GitHub being unavailable all skip it.
# EventBridge Scheduler plus a Lambda cover that case, out of band (ADR-0035).

on:
  workflow_dispatch:
    inputs:
      # EMPTY BY DEFAULT, AND THAT IS THE WHOLE POINT. `launch_id` becomes the
      # `Launch` TAG on every resource this cycle creates, and the watchdog's
      # blunt teardown fires on resources whose Launch tag is PRESENT AND
      # NON-EMPTY. ADR-0035 says it plainly: an owner-run cycle carries
      # `Launch=""` and is invisible to the watchdog, because the guardrails are
      # on the public path and not on the project.
      #
      # A previous version of this file defaulted it to `owner-manual`, which is
      # non-empty, so a hand-dispatched cycle looked exactly like a public launch
      # - except that no lock exists for it, the endpoint never having been
      # involved. The watchdog concluded the resources were orphaned and tore
      # down a LIVE stage four minutes into the run:
      #
      #   23:26:14  dispatched_destroy   (aws-devops-sdet-demo-stage-*)
      #   23:41:12  blunt_teardown       ecs + alb + rds deleted
      #
      # The Lambda always sends its own `ss-` id explicitly and never relies on
      # this default, so making it empty costs the public path nothing and makes
      # the owner's path behave the way ADR-0035 already said it did.
      launch_id:
        description: "Leave EMPTY for an owner-run cycle - it becomes the Launch tag, and a non-empty one makes the watchdog treat this as a public launch it may tear down. The endpoint sends its own."
        required: false
        type: string
        default: ""
      ttl_minutes:
        description: "Hard deadline for this environment, in minutes. Written into the ExpiresAt tag the watchdog reads. Must not be under the sum of this workflow's job timeouts (ADR-0068)."
        required: true
        type: string
        default: "150"

# A SECOND layer, not the guardrail. GitHub's concurrency does not refuse: it
# queues, or it cancels. `cancel-in-progress: true` would cancel a run
# mid-deploy, which is exactly how an environment is left half-created with
# nothing left to destroy it. The refusal that matters is in the Lambda; this
# only covers the race between its check and its dispatch.
concurrency:
  group: self-service
  cancel-in-progress: false

permissions:
  id-token: write
  # `write`, and it was `read` until ADR-0068. NOT a preference: a reusable
  # workflow's permissions must be a SUBSET of its caller's, promote-prod.yml
  # declares `contents: write` to push the release tag (ADR-0029), and a caller
  # granting less is rejected before any job starts. The first unattended launch
  # died exactly there - `startup_failure`, no jobs, nothing in the log.
  #
  # So this is a widening of the PUBLIC path, and it is the second one this ADR
  # makes: the token a stranger's button runs under can now write to the
  # repository. What it does with that is one annotated tag per promotion,
  # created through the Git Data API on a commit the server already holds
  # (ADR-0066). It cannot alter a workflow - that needs `workflows: write`,
  # which ADR-0066 refused and this does not grant.
  contents: write
  # Added in 19d for one thing only: `scripts/break-stale-state-lock.sh` refuses
  # to break a state lock while any other run of this repository is in progress,
  # and it has to be able to ask (ADR-0036 D3).
  actions: read

jobs:
  launch:
    runs-on: ubuntu-latest
    environment: stage
    # Strictly below the 90-minute TTL (ADR-0035 guardrail 3): a hung run has to
    # reach its own destroy job before the deadline it is being held to. These
    # two numbers are coupled - changing var.ttl_minutes without changing these
    # breaks the in-band half of the guarantee.
    timeout-minutes: 45
    outputs:
      alb_url: ${{ steps.tf.outputs.alb_url }}
      expires_at: ${{ steps.deadline.outputs.expires_at }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_demo_account_id: ${{ vars.TF_VAR_demo_account_id }}
      TF_VAR_budget_email: ${{ secrets.TF_VAR_BUDGET_EMAIL }}
      TF_VAR_owner: ${{ vars.TF_VAR_owner }}
      TF_VAR_launch_id: ${{ inputs.launch_id }}
      # Where scripts/tf-stream.sh drops every terraform event stream, and where
      # scripts/fold-timeline.py looks for them (ADR-0039 D2). Per JOB, and this
      # workflow is why the published key carries the job name as well as the run
      # id: one self-service run creates an environment and destroys it again, so
      # a key of run id alone would have the second timeline overwrite the first.
      TF_STREAM_DIR: /tmp/tf-streams
      # THE TWO PROBE NAMES, written through the browser by the regression suite
      # and read out of RDS by an ECS task afterwards (ADR-0088 brings that pair
      # onto the public path). Job level for the reason deploy-stage.yml gives:
      # three steps use them and a value repeated in three places is a value that
      # can disagree with itself.
      UI_PROBE_NAME: ui-probe-${{ github.run_id }}-${{ github.run_attempt }}
      UI_EDIT_PROBE_NAME: ui-edit-probe-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Compute the deadline this environment carries
        id: deadline
        run: |
          set -euo pipefail
          # The tag is the watchdog's key, and it is written here rather than
          # passed in by the Lambda so that the deadline and the resources are
          # created by the same operation. A resource that exists without one is
          # treated as EXPIRED, never as exempt.
          ttl="${{ inputs.ttl_minutes }}"
          case "$ttl" in ''|*[!0-9]*) echo "::error::ttl_minutes must be a positive integer"; exit 1;; esac
          echo "expires_at=$(date -u -d "+${ttl} minutes" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.5"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}



      # WHAT THIS APPLY HAS CREATED, WHILE IT IS CREATING IT (ADR-0076). The
      # watcher runs under the PUBLISH role and every step after this one is
      # back on the deploy role - see .github/actions/watch-progress for why
      # that works and why widening the deploy role was refused.
      #
      # The LAUNCH job only. The teardown job below folds the same way and its
      # join names one node, `destroy.stage`, which is not a noun on the estate
      # board - a delete is matched by environment and not by address, because
      # the destroy nodes are whole levels. There is nothing for a watcher to
      # publish there.
      - name: Start the progress watcher
        uses: ./.github/actions/watch-progress
        with:
          environment: stage
          aws-region: ${{ vars.AWS_REGION }}
          publish-role: ${{ vars.SITE_PUBLISH_ROLE_ARN }}
          deploy-role: ${{ vars.OIDC_ROLE_ARN }}
          site-bucket: ${{ vars.SITE_BUCKET }}
          stream-dir: ${{ env.TF_STREAM_DIR }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Terraform init (S3 backend)
        working-directory: infra/envs/stage
        run: terraform init -input=false

      - name: Resolve shared ECR repository URL
        id: repo
        shell: bash
        env:
          ECR_REPOSITORY: aws-devops-sdet-demo-app
        run: |
          set -euo pipefail
          url="$(aws ecr describe-repositories \
                   --region "$AWS_REGION" \
                   --repository-names "$ECR_REPOSITORY" \
                   --query 'repositories[0].repositoryUri' --output text 2>/dev/null || true)"
          if [ -z "$url" ] || [ "$url" = "None" ]; then
            echo "::error::shared ECR repository $ECR_REPOSITORY not found — apply infra/shared-ecr first (ADR-0018)"
            exit 1
          fi
          echo "ecr_url=$url" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push image
        env:
          ECR_URL: ${{ steps.repo.outputs.ecr_url }}
          ECR_REPOSITORY: aws-devops-sdet-demo-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The registry is IMMUTABLE (ADR-0029), so an existing tag is reused
          # rather than rebuilt. On the public path that is also the common case:
          # every launch runs the same commit.
          if aws ecr describe-images --region "$AWS_REGION" \
               --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "$IMAGE_TAG is already in $ECR_REPOSITORY - reusing it, not rebuilding"
            exit 0
          fi
          docker build -t "$ECR_URL:$IMAGE_TAG" ./app
          docker push "$ECR_URL:$IMAGE_TAG"

      - name: Terraform apply
        working-directory: infra/envs/stage
        env:
          TF_VAR_app_image: ${{ steps.repo.outputs.ecr_url }}:${{ github.sha }}
          TF_VAR_expires_at: ${{ steps.deadline.outputs.expires_at }}
        run: |
          set -euo pipefail
          terraform plan -input=false -out=tfplan
          "$GITHUB_WORKSPACE/scripts/tf-stream.sh" apply \
            apply -input=false -auto-approve -json tfplan

      - name: Read stage outputs
        id: tf
        working-directory: infra/envs/stage
        run: |
          {
            echo "cluster=$(terraform output -raw ecs_cluster_name)"
            echo "service=$(terraform output -raw ecs_service_name)"
            echo "task_def=$(terraform output -raw task_definition_arn)"
            echo "container=$(terraform output -raw container_name)"
            echo "sg=$(terraform output -raw ecs_app_security_group_id)"
            echo "alb_url=$(terraform output -raw alb_url)"
            echo "subnets=$(terraform output -json public_subnet_ids | jq -r 'join(",")')"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for ECS service to be stable
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.tf.outputs.cluster }}" \
            --services "${{ steps.tf.outputs.service }}"

      - name: Run one-off tasks (migrate, seed, db-assert)
        env:
          CLUSTER: ${{ steps.tf.outputs.cluster }}
          TASK_DEF: ${{ steps.tf.outputs.task_def }}
          CONTAINER: ${{ steps.tf.outputs.container }}
          SUBNETS: ${{ steps.tf.outputs.subnets }}
          SG: ${{ steps.tf.outputs.sg }}
          TASK_LOG_DIR: /tmp/task-logs
        run: |
          scripts/ecs-run-task.sh migrate   '["alembic","upgrade","head"]'
          scripts/ecs-run-task.sh seed      '["python","scripts/seed.py"]'
          scripts/ecs-run-task.sh db-assert '["python","scripts/assert_seed.py"]'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # THE SAME SUITES THE OWNER'S PATH RUNS (ADR-0088). This was smoke alone,
      # so that a visitor got a working environment rather than one a test suite
      # had been writing to - and the cost of that was hidden in the promotion:
      # `promote` is conditioned on `needs.launch.result == 'success'`, and with
      # four tests behind that word the public path promoted a digest on a
      # weaker proof than the owner's does with sixty-six. The environment is
      # given back at the end of this job instead: the probes are removed and the
      # seed is re-asserted, which is a cheaper thing to buy than a promotion
      # gate.
      - name: API contract tests against the ALB
        env:
          BASE_URL: ${{ steps.tf.outputs.alb_url }}
        run: make test-api BASE_URL="$BASE_URL" API_JUNIT=/tmp/junit-api.xml

      - name: Playwright smoke + regression against the ALB
        working-directory: tests/playwright
        env:
          BASE_URL: ${{ steps.tf.outputs.alb_url }}
        run: |
          # Both projects named EXPLICITLY, exactly as in deploy-stage.yml: a
          # bare `playwright test` would silently adopt any future project, which
          # is how prod nearly inherited the destructive suite. One invocation,
          # so the report that gets folded onto the map carries both.
          npm install
          npx playwright install --with-deps chromium
          npx playwright test --project=smoke --project=regression

      - name: Assert the UI write reached RDS
        env:
          CLUSTER: ${{ steps.tf.outputs.cluster }}
          TASK_DEF: ${{ steps.tf.outputs.task_def }}
          CONTAINER: ${{ steps.tf.outputs.container }}
          SUBNETS: ${{ steps.tf.outputs.subnets }}
          SG: ${{ steps.tf.outputs.sg }}
        run: |
          # The browser created one row and renamed another. This reads the
          # database directly, from a different process inside the VPC, which is
          # the whole point of the pair and the half a public cycle never had.
          scripts/ecs-run-task.sh ui-write-assert \
            '["python","scripts/assert_ui_write.py"]' \
            "$(jq -nc --arg v "$UI_PROBE_NAME" --arg e "$UI_EDIT_PROBE_NAME" \
               '[{name:"UI_PROBE_NAME",value:$v},{name:"UI_EDIT_PROBE_NAME",value:$e}]')"

      # GIVE THE ENVIRONMENT BACK (ADR-0088). The destructive suites clean up
      # after themselves except for the two probes, which items.spec.ts leaves
      # on purpose for the assertion above. They are removed here, through the
      # application's own API - the same door the browser used - and then the
      # seed is re-asserted, so what a visitor opens is the seeded demo and not
      # the wreckage of a test run.
      #
      # Not `if: always()`: a failed suite leaves its evidence standing. This is
      # tidying, and tidying up after a failure is how a failure gets lost.
      - name: Remove the probes and re-assert the seed
        env:
          BASE_URL: ${{ steps.tf.outputs.alb_url }}
          CLUSTER: ${{ steps.tf.outputs.cluster }}
          TASK_DEF: ${{ steps.tf.outputs.task_def }}
          CONTAINER: ${{ steps.tf.outputs.container }}
          SUBNETS: ${{ steps.tf.outputs.subnets }}
          SG: ${{ steps.tf.outputs.sg }}
          TASK_LOG_DIR: /tmp/task-logs
        run: |
          set -euo pipefail
          # One page is the whole table here: this environment is minutes old and
          # holds the seed row, the probes, and whatever pagination.spec.ts
          # created and then deleted in its own afterAll. 100 is the API's own
          # ceiling. If a row ever did fall past it the seed assertion below
          # still passes and a probe outlives the cycle by twenty minutes, which
          # is the whole of the damage.
          for name in "$UI_PROBE_NAME" "$UI_EDIT_PROBE_NAME"; do
            id="$(curl -sf "$BASE_URL/api/items?limit=100" \
                  | jq -r --arg n "$name" '.items[] | select(.name == $n) | .id' | head -1)"
            if [ -n "$id" ]; then
              curl -sf -X DELETE "$BASE_URL/api/items/$id" > /dev/null
              echo "removed $name (id=$id)"
            else
              # Not a failure: the edit probe is a RENAME, so one of the two
              # names is the row the other one became, and a suite that failed
              # before creating them leaves neither.
              echo "no row named $name"
            fi
          done
          scripts/ecs-run-task.sh seed      '["python","scripts/seed.py"]'
          scripts/ecs-run-task.sh db-assert '["python","scripts/assert_seed.py"]'

      - name: Observe what stage has in AWS
        if: always()
        env:
          APP_URL: ${{ steps.tf.outputs.alb_url }}
        run: scripts/observe-environment.sh stage > /tmp/observation.json

      - name: Fold the terraform event stream into a timeline
        if: always()
        run: >
          python3 scripts/fold-timeline.py
          --environment stage
          --stream-dir "$TF_STREAM_DIR"
          --out /tmp/timeline-stage.json

      # The join onto the map's nodes (ADR-0039 D4). Separate from the fold
      # because it answers a different question - the fold says what terraform
      # did, this says which node on the picture that was - and separate from
      # the page because the rule would otherwise live in JavaScript here and in
      # Python in the gate that checks it.
      #
      # `if: always()` for the same reason the fold has it, and no `continue-on-
      # error`: the script exits 0 even when addresses go unmatched, on purpose.
      - name: Join the timeline onto the map's nodes
        if: always()
        run: >
          python3 scripts/node-states.py
          --topology site/data/topology.json
          --timeline /tmp/timeline-stage.json
          --out /tmp/nodes-stage.json

      # The test reports, folded onto the map's suite nodes (ADR-0042 D5). Reads
      # files only - the junit pytest wrote, the JSON the Playwright reporter
      # left inside the report directory, and the db task's own log, which
      # ecs-run-task.sh now captures because an exit code never said WHICH check
      # failed.
      #
      # `if: always()`, for the reason the timeline fold has it: a run that died
      # after the tests is exactly when their verdict matters. A run that died
      # BEFORE them produces no report, and this publishes nothing rather than a
      # fold of nothing - which would render as a page saying every suite passed.
      - name: Fold the test reports onto the map's suite nodes
        if: always()
        env:
          FOLD_ENV: stage
        run: |
          args=()
          if [ -f /tmp/junit-api.xml ]; then
            args+=(--junit "api=/tmp/junit-api.xml")
          fi
          if [ -f tests/playwright/playwright-report/results.json ]; then
            args+=(--playwright tests/playwright/playwright-report/results.json)
          fi
          if [ -f /tmp/task-logs/db-assert.log ]; then
            args+=(--db-log /tmp/task-logs/db-assert.log)
          fi
          if [ ${#args[@]} -eq 0 ]; then
            echo "no test report was produced, so there is nothing to fold"
            exit 0
          fi
          python3 scripts/fold-results.py \
            --environment "$FOLD_ENV" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "${args[@]}" \
            --out /tmp/results-stage.json



      - name: Configure AWS credentials (OIDC, publish role)
        if: always()
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.SITE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The watcher is stopped and its document removed AFTER the publish role is
      # in the foreground, and that ordering is the whole of it. Placed before
      # this step - which is where it was on 2026-09-08 - the `aws s3 rm` runs
      # under the DEPLOY role, which holds nothing on the site bucket, and the
      # job printed `could not remove the progress document` as a warning and
      # carried on green. The document then sat in the bucket describing an
      # environment that was about to be torn down.
      #
      # It did no harm that day only because the record supersedes a partial
      # reading the moment `published_by` names the run in flight (ADR-0076 D6),
      # and the job published one four seconds later. That is a second defence
      # working, not this one.
      - name: Stop the progress watcher
        if: always()
        uses: ./.github/actions/stop-progress
        with:
          environment: stage
          site-bucket: ${{ vars.SITE_BUCKET }}

      - name: Publish status to the dashboard
        if: always()
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          SITE_DISTRIBUTION_ID: ${{ vars.SITE_DISTRIBUTION_ID }}
          SITE_BASE_URL: ${{ vars.SITE_URL }}
          JOB_STATUS: ${{ job.status }}
          TIMELINE_JSON: /tmp/timeline-stage.json
          NODE_STATES_JSON: /tmp/nodes-stage.json
          RESULTS_JSON: /tmp/results-stage.json
        run: scripts/publish-status.sh stage /tmp/observation.json

  # ---------------------------------------------------------------------------
  # THE PROMOTION. Calls .github/workflows/promote-prod.yml rather than copying
  # it (ADR-0068): the digest resolution, the rollback pointer, the stability
  # and HTTPS waits, the prod smoke and the release record are defined once.
  #
  # THIS IS THE STEP THAT CHANGED WHAT THIS WORKFLOW IS. Until ADR-0068 this
  # file declared no prod environment, and ADR-0034 rested on exactly that:
  # "there is no value of any input that produces a prod credential". That is
  # no longer true, and it is not untrue by accident - the decision is recorded,
  # the reviewer gate on the prod environment is gone, and every document that
  # claimed otherwise has been rewritten rather than left standing.
  #
  # The digest is `github.sha`, the tag the launch job pushed and the suites
  # just proved. Not a rebuild: the same bytes.
  promote:
    needs: launch
    # Only on a GREEN stage. Promoting a digest whose suites failed is the one
    # thing the deploy -> test -> promote shape exists to prevent, and it stays
    # prevented here even though the human approval no longer does.
    if: needs.launch.result == 'success'
    uses: ./.github/workflows/promote-prod.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # THE HOLD. prod is up, stage is gone, and this is the only part of the cycle
  # that exists to be WATCHED rather than to do anything.
  #
  # The deadline is PUBLISHED and the page counts down against its own clock -
  # the same shape as ADR-0067's open cost. What goes in the bucket is an
  # INSTANT, not a number of seconds, so a page rendering it is never showing a
  # figure that was true when it was written and is not now.
  #
  # It lives under `status/`, which publish-site.sh already excludes from its
  # `--delete` sync. A new prefix would have needed a line there too and
  # `make publish-prefixes-check` would have said so - ADR-0044 exists because
  # that line was once forgotten and a cycle's folded results were deleted.
  hold:
    needs: [launch, promote, destroy]
    if: always() && needs.promote.result == 'success'
    runs-on: ubuntu-latest
    # `stage`, and NOT `self-service`, for the reason publish-site.yml states in
    # its own header: the site publish role trusts
    # `repo:<repo>:environment:stage` and the same for prod, with no branch
    # subject at all, so the environment is what makes authentication possible
    # rather than a statement about what this job is.
    #
    # This job declared `self-service` on its first run and spent twelve retries
    # on `Not authorized to perform sts:AssumeRoleWithWebIdentity` before giving
    # up. The self-service environment exists for the narrow CALLBACK role that
    # deletes the lock item; it is not a publishing identity and nothing had ever
    # asked it to be one.
    environment: stage
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      HOLD_MINUTES: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC, publish role)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.SITE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish the deadline, then hold prod up until it passes
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          LAUNCH_ID: ${{ inputs.launch_id }}
        run: |
          set -euo pipefail
          seconds=$(( HOLD_MINUTES * 60 ))
          starts_at="$(date -u -d "+${seconds} seconds" +%Y-%m-%dT%H:%M:%SZ)"

          # Written BEFORE the wait, not after: a countdown published when it
          # expires is a countdown nobody could have watched.
          STARTS_AT="$starts_at" python3 -c '
          import json, os
          print(json.dumps({
              "schema": "countdown/1",
              "environment": "prod",
              "action": "destroy",
              "starts_at": os.environ["STARTS_AT"],
              "hold_minutes": int(os.environ["HOLD_MINUTES"]),
              "launch_id": os.environ.get("LAUNCH_ID", ""),
              "run": {
                  "id": os.environ["GITHUB_RUN_ID"],
                  "url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"]
                         + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              },
          }, indent=1))' > /tmp/countdown.json

          # no-cache, like every other document a CYCLE writes: the page reads
          # this on its 30 s timer, and a cached copy would start the clock from
          # a deadline that has already moved.
          aws s3 cp /tmp/countdown.json "s3://${SITE_BUCKET}/status/countdown.json" \
            --content-type application/json \
            --cache-control "no-cache, max-age=0" \
            --only-show-errors
          echo "prod teardown begins at ${starts_at} (${HOLD_MINUTES} min)"

          sleep "${seconds}"

      - name: Take the countdown down
        if: always()
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          set -uo pipefail
          # The deadline has passed, so the document is a lie in the making.
          # Removed rather than left to expire: a page reading a countdown whose
          # instant is behind it has to invent a sentence for a state nobody
          # designed, and this project has been caught by exactly that before.
          aws s3 rm "s3://${SITE_BUCKET}/status/countdown.json" --only-show-errors || true

  # ---------------------------------------------------------------------------
  # THE PROD TEARDOWN. Calls destroy.yml - the same file the owner dispatches by
  # hand - so the verification against the AWS CLI and the cost fold are the
  # ones already in evidence, not a second implementation of them.
  #
  # `if: always()` and NOT conditioned on the hold succeeding. The hold is a
  # sleep and a bucket write; neither is a reason to leave prod running. If the
  # hold job dies, this still fires and the visitor simply never saw the clock.
  destroy-prod:
    needs: [promote, hold]
    # UNCONDITIONAL. This read `needs.promote.result == 'success'` and the
    # reasoning was "do not tear down a prod that was never created" - which is
    # true of a promote that fails EARLY and false of one that fails LATE.
    #
    # Observed 2026-09-05: promote applied prod, waited for the service, waited
    # for the public HTTPS name, migrated, seeded and smoked green, then failed
    # on its LAST step - the release tag - with HTTP 403. destroy-prod was
    # skipped, and prod was left up and serving 200 with nothing left to remove
    # it. That is the half-created environment with nothing to destroy it, which
    # is the failure this whole workflow is arranged to prevent.
    #
    # A teardown of an environment that does not exist is a no-op: terraform
    # destroy over empty state removes nothing and exits 0. So the asymmetry is
    # total - running it when it was not needed costs a few minutes of runner,
    # and skipping it when it WAS needed costs a live public prod until somebody
    # notices. There is no version of this condition worth the second outcome.
    if: always()
    uses: ./.github/workflows/destroy.yml
    with:
      environment: prod
      confirm: DESTROY
    secrets: inherit

  # The in-band half of guardrail 3. `if: always()` so a failed deploy, a failed
  # smoke and a cancelled test step all still tear the environment down.
  destroy:
    # NOW WAITS FOR THE PROMOTION TOO (ADR-0068). The order a visitor watches is
    # stage up -> prod up -> stage gone -> a countdown -> prod gone, so stage
    # cannot come down until the digest it proved has been promoted.
    # `if: always()` is unchanged and still the point: a failed promotion must
    # not leave stage standing.
    needs: [launch, promote]
    if: always()
    # IT CALLS THE TEARDOWN NOW, LIKE destroy-prod ABOVE (ADR-0080). This was a
    # hand-written copy of destroy.yml - sixteen steps against its nineteen -
    # and ADR-0068 converted the promotion and the prod teardown to calls for
    # exactly this reason while leaving the stage one behind.
    #
    # THE COPY HAD ALREADY DRIFTED, and by the one step that mattered: `Price
    # the cycle from its two timelines`. Watched live on 2026-09-09, cycle #15,
    # both halves green:
    #
    #     destroy       no cost to publish (looked at: '<none>')
    #     destroy-prod  cost: prod - COMPUTED ESTIMATE, 3 priced, 27 free
    #
    # So every cycle the button has ever run priced prod and never priced stage,
    # and the stage figure on the page came from whatever owner-run destroy.yml
    # last touched it. Adding the missing step to the copy would have fixed the
    # symptom and left two definitions of what a teardown is.
    uses: ./.github/workflows/destroy.yml
    with:
      environment: stage
      confirm: DESTROY
    secrets: inherit

  # Guardrail 1's other half: the lock is taken by the Lambda and released here -
  # but only when `destroy` actually succeeded (ADR-0036 D2).
  #
  # Its own GitHub Environment, and its own role, which can delete exactly one
  # item in one table and do nothing else in the account. The stage deploy role
  # is not used for this on purpose - releasing a lock is not a deploy, and the
  # narrower credential is the one that can be described in a sentence.
  #
  # If this job never runs, nothing is stuck forever: the lock's expiry IS the
  # TTL, and an expired lock can be taken over.
  release-lock:
    # AFTER PROD IS GONE TOO. The lock is what stops a second launch, and
    # releasing it while prod was still up would let the next visitor start a
    # cycle on top of a live one.
    needs: [launch, promote, destroy, hold, destroy-prod]
    if: always()
    runs-on: ubuntu-latest
    environment: self-service
    timeout-minutes: 5
    steps:
      # A missing `vars.X` expands to an EMPTY STRING, not an error. Nothing
      # fails where the mistake is; the first thing to USE the value fails
      # instead, and it names only itself. On 2026-08-05 all three of these were
      # absent, this job died on "Input required and not supplied: aws-region",
      # and fixing that one would have bought the next failure rather than a
      # working job.
      #
      # This job is the only one outside `environment: stage`, so it is the only
      # one that reads variables from an environment GitHub created ITSELF, on
      # this workflow's first run, with nothing in it. The other jobs were never
      # going to notice.
      #
      # Named together, so one run reports the whole gap.
      - name: Every identifier this job needs is present
        env:
          REGION: ${{ vars.AWS_REGION }}
          ROLE: ${{ vars.SELF_SERVICE_CALLBACK_ROLE_ARN }}
          TABLE: ${{ vars.SELF_SERVICE_TABLE }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$REGION" ] || missing="$missing AWS_REGION"
          [ -n "$ROLE" ]   || missing="$missing SELF_SERVICE_CALLBACK_ROLE_ARN"
          [ -n "$TABLE" ]  || missing="$missing SELF_SERVICE_TABLE"
          if [ -n "$missing" ]; then
            echo "::error::repository variables not set:$missing - the lock will not be released and the button stays blocked until the deadline. See docs/preflight-inventory.md."
            exit 1
          fi
          echo "region, callback role and table are all set"

      - name: Configure AWS credentials (OIDC, callback role)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.SELF_SERVICE_CALLBACK_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Release the launch lock
        env:
          TABLE: ${{ vars.SELF_SERVICE_TABLE }}
          LAUNCH_ID: ${{ inputs.launch_id }}
          DESTROY_RESULT: ${{ needs.destroy.result }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query Arn --output text

          # ADR-0036 D2. This job used to release the lock without ever asking
          # how `destroy` went, which is how a cancelled run ended up with an
          # environment alive, no lock, and a button that let the next visitor
          # spend one of the day's three launches on an apply guaranteed to die
          # on the same state lock. A destroy that did not succeed means
          # something is still there.
          #
          # Nothing is wedged by keeping it: the lock carries the TTL, an
          # expired lock can be taken over, and the watchdog releases it after
          # the blunt path.
          if [ "$DESTROY_RESULT" != "success" ]; then
            echo "::notice::destroy finished as '$DESTROY_RESULT', so the lock is DELIBERATELY NOT released. The button stays shut until the watchdog has dealt with what is still running, or until the lock expires."
            exit 0
          fi
          # Conditional: only THIS launch's lock. A run that overran its TTL and
          # was superseded must not delete the lock of the launch that replaced
          # it - the second one is still running, and would then be joined by a
          # third.
          if aws dynamodb delete-item \
               --table-name "$TABLE" \
               --key '{"pk":{"S":"lock"}}' \
               --condition-expression 'launch_id = :id' \
               --expression-attribute-values "{\":id\":{\"S\":\"$LAUNCH_ID\"}}" 2>/dev/null; then
            echo "released the lock held by $LAUNCH_ID"
          else
            echo "the lock is not ours (superseded, or already released). Left alone."
          fi
