name: promote-prod

# Promotes to prod an image that already passed stage. It NEVER builds.
#
# The image is referenced by DIGEST, resolved at run time from the tag a green
# deploy-stage run pushed, so prod runs the exact bytes stage tested. Rebuilding
# from the same commit would produce a different artifact and turn "tested in
# stage" from a fact into an assumption.
#
# The approval gate has two halves and both are required:
#   GitHub  the environment `prod` carries required reviewers, so this job
#           pauses before its first step runs;
#   AWS     the prod deploy role trusts ONLY `environment:prod` and has no
#           branch subject (ADR-0021), so a workflow that skipped the
#           environment could not authenticate at all.
#
# Manual only, like deploy-stage: prod is billable and short-lived (ADR-0017
# D2a) - brought up on demand, torn down via destroy.yml.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag pushed by a GREEN deploy-stage run (that run's commit SHA)"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_demo_account_id: ${{ vars.TF_VAR_demo_account_id }}
      TF_VAR_budget_email: ${{ vars.TF_VAR_budget_email }}
      TF_VAR_owner: ${{ vars.TF_VAR_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve the image digest
        id: image
        shell: bash
        env:
          ECR_REPOSITORY: aws-devops-sdet-demo-app
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # `|| true` so a missing repository or tag reaches the checks below and
          # gets an actionable message instead of a raw AWS exception.
          url="$(aws ecr describe-repositories \
                   --region "$AWS_REGION" \
                   --repository-names "$ECR_REPOSITORY" \
                   --query 'repositories[0].repositoryUri' --output text 2>/dev/null || true)"
          if [ -z "$url" ] || [ "$url" = "None" ]; then
            echo "::error::shared ECR repository $ECR_REPOSITORY not found - apply infra/shared-ecr first (ADR-0018)"
            exit 1
          fi

          digest="$(aws ecr describe-images \
                      --region "$AWS_REGION" \
                      --repository-name "$ECR_REPOSITORY" \
                      --image-ids imageTag="$IMAGE_TAG" \
                      --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          if [ -z "$digest" ] || [ "$digest" = "None" ]; then
            echo "::error::tag '$IMAGE_TAG' is not in $ECR_REPOSITORY - promote a tag that a green deploy-stage run pushed"
            exit 1
          fi

          echo "promoting $url@$digest"
          echo "ref=$url@$digest" >> "$GITHUB_OUTPUT"

      - name: Terraform init (S3 backend)
        working-directory: infra/envs/prod
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: infra/envs/prod
        env:
          TF_VAR_app_image: ${{ steps.image.outputs.ref }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: infra/envs/prod
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read prod outputs
        id: tf
        working-directory: infra/envs/prod
        run: |
          {
            echo "cluster=$(terraform output -raw ecs_cluster_name)"
            echo "service=$(terraform output -raw ecs_service_name)"
            echo "task_def=$(terraform output -raw task_definition_arn)"
            echo "container=$(terraform output -raw container_name)"
            echo "sg=$(terraform output -raw ecs_app_security_group_id)"
            echo "alb_url=$(terraform output -raw alb_url)"
            echo "app_url=$(terraform output -raw app_url)"
            echo "subnets=$(terraform output -json public_subnet_ids | jq -r 'join(",")')"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for ECS service to be stable
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.tf.outputs.cluster }}" \
            --services "${{ steps.tf.outputs.service }}"

      - name: Wait for the public HTTPS name to answer
        env:
          APP_URL: ${{ steps.tf.outputs.app_url }}
        run: |
          set -euo pipefail
          # The alias record is created by the same apply that created the ALB.
          # Route53 alias propagation is fast but not instant, and a smoke run
          # that failed on NXDOMAIN would read as an application failure.
          #
          # curl verifies the certificate chain by default, so a 200 here is
          # also the machine-checked half of "valid certificate" - the phase's
          # closing criterion, asserted rather than eyeballed in a browser.
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$APP_URL/health" || true)"
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then
              echo "$APP_URL/health answered 200 over a verified TLS connection"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$APP_URL/health did not answer 200 within 5 minutes"
          exit 1

      - name: Provision the prod database (migrate, seed, db-assert)
        env:
          CLUSTER: ${{ steps.tf.outputs.cluster }}
          TASK_DEF: ${{ steps.tf.outputs.task_def }}
          CONTAINER: ${{ steps.tf.outputs.container }}
          SUBNETS: ${{ steps.tf.outputs.subnets }}
          SG: ${{ steps.tf.outputs.sg }}
        run: |
          # prod is created and destroyed with every cycle and keeps no data
          # between them (ADR-0017 D2a), so migrate and seed are PROVISIONING
          # here, not test fixtures. The seed is idempotent.
          run_task() {
            local label="$1"; shift
            local overrides
            overrides=$(jq -nc --arg name "$CONTAINER" --argjson cmd "$1" \
              '{containerOverrides:[{name:$name,command:$cmd}]}')
            echo "::group::run-task $label"
            local arn
            arn=$(aws ecs run-task \
              --cluster "$CLUSTER" \
              --task-definition "$TASK_DEF" \
              --launch-type FARGATE \
              --count 1 \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
              --overrides "$overrides" \
              --query 'tasks[0].taskArn' --output text)
            echo "task: $arn"
            aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$arn"
            local code
            code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$arn" \
              --query 'tasks[0].containers[0].exitCode' --output text)
            echo "exitCode: $code"
            echo "::endgroup::"
            if [ "$code" != "0" ]; then
              echo "$label failed (exitCode=$code)"; exit 1
            fi
          }
          run_task migrate    '["alembic","upgrade","head"]'
          run_task seed       '["python","scripts/seed.py"]'
          run_task db-assert  '["python","scripts/assert_seed.py"]'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Read-only smoke against prod
        working-directory: tests/playwright
        env:
          BASE_URL: ${{ steps.tf.outputs.app_url }}
        run: |
          # Read-only on purpose. Destructive regression belongs to stage, which
          # is seeded and disposable; prod gets the smoke that proves the
          # promoted image serves traffic and reaches its database.
          npm install
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod
          path: tests/playwright/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### promote-prod"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| tag promoted | ${{ inputs.image_tag }} |"
            echo "| image | ${{ steps.image.outputs.ref }} |"
            echo "| prod URL | ${{ steps.tf.outputs.app_url }} |"
            echo ""
            echo "prod is billable while it is up. Tear it down with the destroy workflow (environment: prod)."
          } >> "$GITHUB_STEP_SUMMARY"
