name: promote-prod

# Promotes to prod an image that already passed stage. It NEVER builds.
#
# The image is referenced by DIGEST, resolved at run time from the tag a green
# deploy-stage run pushed, so prod runs the exact bytes stage tested. Rebuilding
# from the same commit would produce a different artifact and turn "tested in
# stage" from a fact into an assumption.
#
# The approval gate has two halves and both are required:
#   GitHub  the environment `prod` carries required reviewers, so this job
#           pauses before its first step runs;
#   AWS     the prod deploy role trusts ONLY `environment:prod` and has no
#           branch subject (ADR-0021), so a workflow that skipped the
#           environment could not authenticate at all.
#
# Manual only, like deploy-stage: prod is billable and short-lived (ADR-0017
# D2a) - brought up on demand, torn down via destroy.yml.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag pushed by a GREEN deploy-stage run (that run's commit SHA)"
        required: true

permissions:
  id-token: write
  # write, not read: a green prod smoke pushes an annotated release tag
  # (ADR-0029). This is a widening of the most privileged workflow in the
  # repository, and it applies to the repository only - the AWS side is
  # unchanged and still has no static keys.
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_demo_account_id: ${{ vars.TF_VAR_demo_account_id }}
      # A SECRET, not a variable (Phase 15). GitHub does not mask variables, so
      # this address was printed in the step env dump of a PUBLIC repository's
      # logs. It is scoped to the `stage` and `prod` environments, exactly as the
      # variable it replaces was.
      TF_VAR_budget_email: ${{ secrets.TF_VAR_BUDGET_EMAIL }}
      TF_VAR_owner: ${{ vars.TF_VAR_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tag goes on the commit the IMAGE was built from, which
          # is the dispatched tag, not this workflow's own head. A shallow
          # checkout cannot name an older commit.
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.5"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve the image digest
        id: image
        shell: bash
        env:
          ECR_REPOSITORY: aws-devops-sdet-demo-app
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # `|| true` so a missing repository or tag reaches the checks below and
          # gets an actionable message instead of a raw AWS exception.
          url="$(aws ecr describe-repositories \
                   --region "$AWS_REGION" \
                   --repository-names "$ECR_REPOSITORY" \
                   --query 'repositories[0].repositoryUri' --output text 2>/dev/null || true)"
          if [ -z "$url" ] || [ "$url" = "None" ]; then
            echo "::error::shared ECR repository $ECR_REPOSITORY not found - apply infra/shared-ecr first (ADR-0018)"
            exit 1
          fi

          digest="$(aws ecr describe-images \
                      --region "$AWS_REGION" \
                      --repository-name "$ECR_REPOSITORY" \
                      --image-ids imageTag="$IMAGE_TAG" \
                      --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          if [ -z "$digest" ] || [ "$digest" = "None" ]; then
            echo "::error::tag '$IMAGE_TAG' is not in $ECR_REPOSITORY - promote a tag that a green deploy-stage run pushed"
            exit 1
          fi

          echo "promoting $url@$digest"
          echo "ref=$url@$digest" >> "$GITHUB_OUTPUT"

      - name: Read the rollback pointer
        id: pointer
        shell: bash
        env:
          # Deterministic name, duplicated from infra/shared-ecr deliberately
          # (ADR-0029): a workflow derives it without reading Terraform state,
          # exactly as it derives the repository URL.
          PARAM: /release/aws-devops-sdet-demo/prod/last-good-image-digest
        run: |
          set -euo pipefail
          # Read BEFORE the apply, so "rollback is not armed" is said while it
          # is still actionable rather than discovered at the moment it matters.
          value="$(aws ssm get-parameter --region "$AWS_REGION" --name "$PARAM" \
                     --query 'Parameter.Value' --output text 2>/dev/null || true)"
          if [ -z "$value" ] || [ "$value" = "None" ]; then
            echo "::error::rollback pointer $PARAM does not exist - apply infra/shared-ecr first (ADR-0029)"
            exit 1
          fi
          if [ "$value" = "none" ]; then
            echo "::warning::no previous release recorded - rollback is NOT armed for this run"
          else
            echo "rollback target if this release fails: $value"
          fi
          echo "digest=$value" >> "$GITHUB_OUTPUT"

      - name: Terraform init (S3 backend)
        working-directory: infra/envs/prod
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: infra/envs/prod
        env:
          TF_VAR_app_image: ${{ steps.image.outputs.ref }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        id: apply
        working-directory: infra/envs/prod
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read prod outputs
        id: tf
        working-directory: infra/envs/prod
        run: |
          {
            echo "cluster=$(terraform output -raw ecs_cluster_name)"
            echo "service=$(terraform output -raw ecs_service_name)"
            echo "task_def=$(terraform output -raw task_definition_arn)"
            echo "container=$(terraform output -raw container_name)"
            echo "sg=$(terraform output -raw ecs_app_security_group_id)"
            echo "alb_url=$(terraform output -raw alb_url)"
            echo "app_url=$(terraform output -raw app_url)"
            echo "subnets=$(terraform output -json public_subnet_ids | jq -r 'join(",")')"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for ECS service to be stable
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.tf.outputs.cluster }}" \
            --services "${{ steps.tf.outputs.service }}"

      - name: Wait for the public HTTPS name to answer
        env:
          APP_URL: ${{ steps.tf.outputs.app_url }}
        run: |
          set -euo pipefail
          # The alias record is created by the same apply that created the ALB.
          # Route53 alias propagation is fast but not instant, and a smoke run
          # that failed on NXDOMAIN would read as an application failure.
          #
          # curl verifies the certificate chain by default, so a 200 here is
          # also the machine-checked half of "valid certificate" - the phase's
          # closing criterion, asserted rather than eyeballed in a browser.
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$APP_URL/health" || true)"
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then
              echo "$APP_URL/health answered 200 over a verified TLS connection"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$APP_URL/health did not answer 200 within 5 minutes"
          exit 1

      - name: Provision the prod database (migrate, seed, db-assert)
        env:
          CLUSTER: ${{ steps.tf.outputs.cluster }}
          TASK_DEF: ${{ steps.tf.outputs.task_def }}
          CONTAINER: ${{ steps.tf.outputs.container }}
          SUBNETS: ${{ steps.tf.outputs.subnets }}
          SG: ${{ steps.tf.outputs.sg }}
        run: |
          # prod is created and destroyed with every cycle and keeps no data
          # between them (ADR-0017 D2a), so migrate and seed are PROVISIONING
          # here, not test fixtures. The seed is idempotent.
          scripts/ecs-run-task.sh migrate   '["alembic","upgrade","head"]'
          scripts/ecs-run-task.sh seed      '["python","scripts/seed.py"]'
          scripts/ecs-run-task.sh db-assert '["python","scripts/assert_seed.py"]'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Read-only smoke against prod
        id: smoke
        working-directory: tests/playwright
        env:
          BASE_URL: ${{ steps.tf.outputs.app_url }}
        run: |
          # `--project=smoke` is what makes "read-only" true. Until Phase 10
          # this step ran the whole testDir and was read-only only because no
          # destructive spec existed; the comment claiming otherwise would have
          # survived the first one unchanged. The projects select by directory
          # (ADR-0025), so prod runs tests/smoke/ and nothing else, and
          # `make test-spec-coverage` fails if a spec belongs to no project.
          npm install
          npx playwright install --with-deps chromium
          npx playwright test --project=smoke

      # ----------------------------------------------------------------------
      # The release is made HERE and nowhere earlier (ADR-0029). A digest
      # becomes a release at the moment the prod smoke goes green.
      #
      # The pointer is written FIRST of the three records, deliberately: it is
      # the one a future rollback depends on, so if the tagging that follows
      # fails, the failure is loud and the next promotion is still protected.
      # ----------------------------------------------------------------------
      - name: Record this digest as the last good release
        env:
          PARAM: /release/aws-devops-sdet-demo/prod/last-good-image-digest
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          digest="${IMAGE_REF##*@}"
          aws ssm put-parameter --region "$AWS_REGION" --name "$PARAM" \
            --type String --overwrite --value "$digest" >/dev/null
          echo "last good prod digest is now $digest"

      - name: Tag the release in the registry and in git
        id: release
        env:
          ECR_REPOSITORY: aws-devops-sdet-demo-app
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          PROMOTED_SHA: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          digest="${IMAGE_REF##*@}"
          name="release-$(date -u +%Y%m%d-%H%M)-${PROMOTED_SHA:0:7}"

          # An annotated tag needs a committer, and a runner has none: without
          # this git exits 128 with "empty ident name", three seconds into a
          # step that has already published the ECR half of the release.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Adding a NEW tag to an existing manifest is permitted under an
          # immutable registry; repointing an existing tag is what is not.
          # Two calls rather than one joined query: a manifest is JSON and can
          # carry whitespace, so splitting a joined field is a parse waiting to
          # go wrong on an image that looks no different from the others.
          manifest="$(aws ecr batch-get-image --region "$AWS_REGION" \
                        --repository-name "$ECR_REPOSITORY" \
                        --image-ids imageDigest="$digest" \
                        --query 'images[0].imageManifest' --output text)"
          media="$(aws ecr batch-get-image --region "$AWS_REGION" \
                     --repository-name "$ECR_REPOSITORY" \
                     --image-ids imageDigest="$digest" \
                     --query 'images[0].imageManifestMediaType' --output text)"
          aws ecr put-image --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-tag "$name" \
            --image-manifest "$manifest" \
            --image-manifest-media-type "$media" >/dev/null

          # On the commit the IMAGE was built from - the dispatched tag - not on
          # this workflow's own head. They are usually the same commit, and the
          # day they are not is the day an untagged release becomes untraceable.
          git tag -a "$name" -m "prod release $name, image $digest" "$PROMOTED_SHA"
          git push origin "$name"
          echo "released $name -> $digest"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # Rollback (ADR-0029). Fires when prod was actually changed and then
      # failed to prove itself healthy: the apply succeeded and the smoke did
      # NOT pass. A skipped smoke counts - if the stability wait or the HTTPS
      # wait failed, the release never got far enough to be tested, and that is
      # the most obvious broken release there is.
      #
      # The second half of the condition is not decoration. Without it the
      # trigger is "something after the apply failed", which includes the
      # release bookkeeping that runs AFTER a green smoke - so a failed git tag
      # would roll back a prod that had just proved itself healthy. Found by a
      # live run on 2026-07-28, where exactly that happened and only an empty
      # pointer stopped it.
      #
      # Nothing below can turn this run green, and that is the intent: a
      # promotion whose release failed is a failed promotion even when the
      # recovery worked.
      # ----------------------------------------------------------------------
      - name: Resolve the rollback target
        id: rollback
        if: failure() && steps.apply.outcome == 'success' && steps.smoke.outcome != 'success'
        env:
          ECR_REPOSITORY: aws-devops-sdet-demo-app
          ROLLBACK_DIGEST: ${{ steps.pointer.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$ROLLBACK_DIGEST" = "none" ]; then
            echo "::error::this release failed and no previous release exists to roll back to. prod is left standing for inspection - tear it down with the destroy workflow (environment: prod)."
            exit 1
          fi
          # The pointer can outlive the image it names: the lifecycle policy
          # expires by count and cannot protect a prefix (ADR-0029 s5). Checked
          # against the registry, not assumed.
          if ! aws ecr describe-images --region "$AWS_REGION" \
                 --repository-name "$ECR_REPOSITORY" \
                 --image-ids imageDigest="$ROLLBACK_DIGEST" >/dev/null 2>&1; then
            echo "::error::rollback target $ROLLBACK_DIGEST is no longer in $ECR_REPOSITORY - the lifecycle policy expired it. prod is left standing for inspection."
            exit 1
          fi
          url="$(aws ecr describe-repositories --region "$AWS_REGION" \
                   --repository-names "$ECR_REPOSITORY" \
                   --query 'repositories[0].repositoryUri' --output text)"
          echo "rolling prod back to $url@$ROLLBACK_DIGEST"
          echo "ref=$url@$ROLLBACK_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Apply the rollback
        id: rollback_apply
        if: failure() && steps.rollback.outcome == 'success'
        working-directory: infra/envs/prod
        env:
          TF_VAR_app_image: ${{ steps.rollback.outputs.ref }}
        run: |
          set -euo pipefail
          # A second apply, NOT `aws ecs update-service`. update-service would
          # leave the running revision and the Terraform state disagreeing, and
          # here the next apply IS the next release - it would quietly undo the
          # rollback without anyone asking for that.
          terraform apply -input=false -auto-approve
          aws ecs wait services-stable \
            --cluster "$(terraform output -raw ecs_cluster_name)" \
            --services "$(terraform output -raw ecs_service_name)"
          # Re-read rather than reuse steps.tf: the outputs step is one of the
          # things that may have failed on the way here.
          echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"

      - name: Prove the rollback restored a working prod
        if: failure() && steps.rollback_apply.outcome == 'success'
        working-directory: tests/playwright
        env:
          BASE_URL: ${{ steps.rollback_apply.outputs.app_url }}
        run: |
          set -euo pipefail
          # Without this step "rolled back" is a claim nobody checked, and a
          # rollback that restored a broken service would report success. The
          # runner has Node preinstalled, so this does not depend on the setup
          # step having been reached before the failure.
          npm install
          npx playwright install --with-deps chromium
          npx playwright test --project=smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-prod
          path: tests/playwright/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### promote-prod"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| tag promoted | ${{ inputs.image_tag }} |"
            echo "| image | ${{ steps.image.outputs.ref }} |"
            echo "| prod URL | ${{ steps.tf.outputs.app_url }} |"
            echo "| release | ${{ steps.release.outputs.name || '(none - this release did not pass)' }} |"
            echo "| rollback target | ${{ steps.pointer.outputs.digest }} |"
            echo "| rollback applied | ${{ steps.rollback_apply.outcome || 'no' }} |"
            echo ""
            echo "prod is billable while it is up. Tear it down with the destroy workflow (environment: prod)."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Dashboard (ADR-0026). Two steps and TWO ROLES, deliberately: the
      # observation needs the deploy role's read access to ECS/ALB/RDS, the
      # upload needs only the narrow publish role. Re-configuring credentials
      # here also means every step after this point has lost the deploy role,
      # which is why these are last.
      #
      # `if: always()` throughout. A run that died half way is exactly when the
      # dashboard must be written, because that is when the environment is in a
      # state nobody would have predicted - and a status file that only ever
      # appears after success would report the account as whatever it was the
      # last time things went well.
      # ---------------------------------------------------------------------
      - name: Observe what prod has in AWS
        if: always()
        env:
          APP_URL: ${{ steps.tf.outputs.app_url }}
        run: scripts/observe-environment.sh prod > /tmp/observation.json

      - name: Configure AWS credentials (OIDC, publish role)
        if: always()
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.SITE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish status and report to the dashboard
        if: always()
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          SITE_DISTRIBUTION_ID: ${{ vars.SITE_DISTRIBUTION_ID }}
          SITE_BASE_URL: ${{ vars.SITE_URL }}
          JOB_STATUS: ${{ job.status }}
        run: scripts/publish-status.sh prod /tmp/observation.json tests/playwright/playwright-report
