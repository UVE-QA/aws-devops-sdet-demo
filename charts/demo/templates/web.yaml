# The web: nginx serving the interface on 80. No proxy include here - the
# Ingress below carries the path rules the ALB carries on ECS, so the AWS
# image runs exactly as built (ADR-0095 D2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/name: web
spec:
  replicas: {{ .Values.replicas.web }}
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "demo.labels" . | nindent 8 }}
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: web
          image: {{ include "demo.image" (dict "Values" .Values "name" "web") }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
