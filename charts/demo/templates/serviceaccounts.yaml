# One service account per service that talks to AWS, annotated with the IRSA
# role Terraform made for it (ADR-0097 D4). web has none: it talks to nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.api.name }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/name: api
  annotations:
    eks.amazonaws.com/role-arn: {{ include "demo.roleArn" (dict "Values" .Values "name" "api") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.worker.name }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/name: worker
  annotations:
    eks.amazonaws.com/role-arn: {{ include "demo.roleArn" (dict "Values" .Values "name" "worker") }}
